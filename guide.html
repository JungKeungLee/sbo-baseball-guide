<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이동 중… · 워니의 야구 입문서</title>
  <!-- 예전 주소(guide.html#card-xxx, #ch-n)를 새 페이지로 옮겨줌 -->
  <script src="guide-data.js"></script>
  <script>
    (function () {
      var hash = location.hash || "";
      var m = hash.match(/^#card-([\w-]+)$/);
      var page = "rules.html";
      if (m) {
        var ch = guideChapters.find(function (c) { return c.cards.some(function (x) { return x.id === m[1]; }); });
        if (ch) page = { pos: "positions.html", rule: "rules.html", quiz: "quiz.html" }[ch.track];
        location.replace(page + hash);
      } else {
        location.replace("index.html");
      }
    })();
  </script>
</head>
<body><p><a href="index.html">홈으로 이동</a></p></body>
</html>
