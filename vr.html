<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VR 야구 준비부터 마무리까지 · 워니의 야구 입문서</title>
  <meta name="description" content="VR 야구 하기 전 준비운동, 착용 전 체크, 플레이 중 주의사항, 끝난 후 스트레칭까지 5~10분 가이드">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guide.css">
  <link rel="stylesheet" href="vr.css">
</head>
<body class="guide vr" data-page="vr">
  <main>
    <section class="page-head">
      <span class="ph-icon" aria-hidden="true">🥽</span>
      <h1>VR 야구 하기 전 꼭 보기</h1>
      <p>몸 풀기 → 공간 체크 → 안전하게 플레이 → 스트레칭.<br><b>시작 전에 5~10분만!</b></p>
    </section>

    <nav class="vr-tabs" id="vrTabs" role="tablist" aria-label="VR 가이드 탭"></nav>
    <section id="vrPanel" class="vr-panel" aria-live="polite"></section>

    <p class="vr-notice" id="vrNotice"></p>
  </main>

  <footer class="footer">
    <p>⚾ SBO 재밌게 보자! — 워니의 야구 입문서</p>
  </footer>

  <!-- 따라하기 모드 -->
  <div class="follow" id="follow" role="dialog" aria-modal="true" aria-labelledby="fwTitle" hidden>
    <div class="fw-top">
      <p class="fw-title" id="fwTitle"></p>
      <button class="fw-close" aria-label="따라하기 닫기">✕</button>
    </div>
    <div class="fw-progress"><span class="fw-bar"><i></i></span><span class="fw-count"></span></div>
    <div class="fw-main">
      <div class="fw-fig"></div>
      <p class="fw-name"></p>
      <p class="fw-meta"></p>
      <p class="fw-how"></p>
      <p class="fw-warn"></p>
      <div class="fw-timer">
        <svg class="fw-ring" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="20" r="16" pathLength="100" class="bg"/>
          <circle cx="20" cy="20" r="16" pathLength="100" class="on"/>
        </svg>
        <span class="fw-sec"></span>
        <button class="fw-pause"></button>
      </div>
    </div>
    <div class="fw-btns">
      <button class="btn btn-ghost fw-prev">← 이전</button>
      <button class="btn btn-primary fw-next">다음 운동 →</button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script src="nav.js"></script>
  <script src="vr-data.js"></script>
  <script src="vr.js"></script>
</body>
</html>
