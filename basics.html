<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>처음 보는 야구 · 워니의 야구 입문서</title>
  <meta name="description" content="점수, 베이스, 스트라이크와 볼, 아웃, 안타, 홈런, 이닝까지 한 단계씩 넘겨보는 야구 기본 규칙">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚾</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="guide.css">
</head>
<body class="guide" data-page="basics">
  <main>
    <section class="page-head">
      <span class="ph-icon" aria-hidden="true">⚾</span>
      <h1>처음 보는 야구</h1>
      <p>야구 하나도 몰라도 괜찮아! 한 장씩 넘기면 끝이에요.</p>
      <div id="trackProgress" class="track-progress"></div>
    </section>

    <nav class="chap-nav" id="stepNav" aria-label="단계 목록"></nav>

    <section class="g-chapter steps-wrap" id="stepTop">
      <p class="step-count" id="stepCount"></p>
      <div id="lessons"></div>

      <!-- 전광판 읽기 -->
      <article class="card board-card step" data-step-id="board" hidden>
        <h3><span class="lesson-emoji">📺</span> 실전 전광판 읽기</h3>
        <p class="lead">경기 볼 때 화면 구석에 나오는 이거! 이제 읽을 수 있어요.</p>
        <div id="scoreboard" class="scoreboard"></div>
        <div class="board-switch" id="boardSwitch"></div>
        <div class="board-explain" id="boardExplain"></div>
        <p class="board-note">💡 실제 전광판에는 <b>B 3개 · S 2개 · O 2개</b>만 있어요. 마지막 하나가 채워지는 순간 바로 결과가 나니까!</p>
      </article>

      <!-- 한 줄 요약 + 보너스 용어 -->
      <div class="step" data-step-id="summary" hidden>
        <article class="card summary-card">
          <h2>이것만 기억해도<br><span class="hl">야구 볼 수 있다!</span></h2>
          <ol class="flow" id="flow"></ol>
        </article>
        <div class="more-wrap">
          <button class="btn btn-outline" id="moreToggle" aria-expanded="false" aria-controls="glossary">
            이것까지 알면 야구 좀 아는 사람 😎 <span class="chev">▾</span>
          </button>
          <div id="glossary" class="glossary" hidden></div>
        </div>
      </div>

      <nav class="ch-pager step-pager">
        <button class="btn btn-ghost" id="stepPrev">← 이전</button>
        <button class="btn btn-primary" id="stepNext">👍 이해했어! 다음 →</button>
      </nav>
    </section>
  </main>

  <footer class="footer">
    <p>⚾ SBO 재밌게 보자! — 워니의 야구 입문서</p>
    <button class="reset-btn" id="resetAll">'다 봤어요' 표시 지우기</button>
  </footer>

  <div class="toast" id="toast" role="status"></div>

  <script src="nav.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
